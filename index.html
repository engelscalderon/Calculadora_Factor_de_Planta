<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Factor de Planta FV</title>
    <!-- Tailwind CSS para el diseño visual -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome para los íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between antialiased font-sans">

    <!-- Contenedor Principal -->
    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
            
            <!-- Encabezado con estética de energía solar -->
            <div class="bg-gradient-to-r from-yellow-500 to-amber-600 p-6 text-white text-center shadow-md">
                <div class="inline-flex items-center justify-center p-3 bg-white bg-opacity-20 rounded-2xl mb-3">
                    <i class="fa-solid fa-solar-panel text-3xl"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Factor de Planta</h1>
                <p class="text-xs text-amber-100 mt-1 font-medium">Calculadora para Plantas Fotovoltaicas</p>
            </div>

            <!-- Formulario y Controles -->
            <div class="p-6 space-y-5">
                
                <!-- Input: Energía Generada con Selector de Magnitud -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Energía Generada</label>
                    <div class="flex space-x-2">
                        <div class="relative rounded-xl shadow-sm flex-grow">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <input type="number" id="energia" value="198000" oninput="calcularFactor()"
                                class="block w-full pl-10 pr-3 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white text-gray-800 font-medium transition-all">
                        </div>
                        <!-- Desplegable Magnitud Energía -->
                        <select id="unidad_energia" onchange="calcularFactor()" 
                            class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 text-sm font-bold text-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer">
                            <option value="GWh">GWh</option>
                            <option value="MWh" selected>MWh</option>
                            <option value="kWh">kWh</option>
                        </select>
                    </div>
                </div>

                <!-- Input: Potencia Nominal con Selector de Magnitud -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Potencia Instalada / Nominal</label>
                    <div class="flex space-x-2">
                        <div class="relative rounded-xl shadow-sm flex-grow">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-charging-station"></i>
                            </div>
                            <input type="number" id="potencia" value="87.8" step="0.1" oninput="calcularFactor()"
                                class="block w-full pl-10 pr-3 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white text-gray-800 font-medium transition-all">
                        </div>
                        <!-- Desplegable Magnitud Potencia -->
                        <select id="unidad_potencia" onchange="calcularFactor()" 
                            class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 text-sm font-bold text-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer">
                            <option value="GW">GW</option>
                            <option value="MW" selected>MW</option>
                            <option value="kW">kW</option>
                        </select>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-4 grid grid-cols-2 gap-3">
                    <!-- Selector: Periodicidad del Periodo -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Periodicidad</label>
                        <div class="relative rounded-xl shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-calendar-days"></i>
                            </div>
                            <select id="periodicidad" onchange="actualizarHorasPorPeriodo()" 
                                class="block w-full pl-10 pr-3 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-semibold text-gray-700 cursor-pointer">
                                <option value="anual" selected>Anual</option>
                                <option value="mensual">Mensual</option>
                                <option value="diario">Diario</option>
                            </select>
                        </div>
                    </div>

                    <!-- Input: Tiempo en Horas (Afectado por la periodicidad) -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Tiempo (Horas)</label>
                        <div class="relative rounded-xl shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-clock"></i>
                            </div>
                            <input type="number" id="tiempo" value="8760" oninput="calcularFactor()"
                                class="block w-full pl-10 pr-3 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white text-gray-800 font-medium transition-all">
                        </div>
                    </div>
                </div>

                <!-- Bloque de Resultado -->
                <div class="mt-6 p-5 bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl border border-amber-100 text-center shadow-inner">
                    <span class="block text-xs font-bold text-amber-700 uppercase tracking-widest mb-1">Factor de Planta Resultante</span>
                    <span id="resultado" class="text-5xl font-black text-amber-600 tracking-tight">25.74%</span>
                </div>

                <!-- Botón para Compartir por WhatsApp -->
                <button onclick="compartirWhatsApp()" 
                    class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center space-x-2 transform active:scale-95">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Compartir por WhatsApp</span>
                </button>

            </div>
        </div>
    </div>

    <!-- Footer con Logo Real de Modo Energía -->
    <footer class="flex flex-col items-center justify-center pb-6 space-y-2">
        <!-- Logo circular mapeado directamente al archivo logo.jpeg del repositorio -->
        <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-amber-500 shadow-md bg-white flex items-center justify-center">
            <img src="logo.jpeg" alt="Logo Modo Energía" class="w-full h-full object-cover">
        </div>
        <div class="text-center text-xs font-bold tracking-wide text-gray-400 uppercase">
            Modo Energía © 2026
        </div>
    </footer>

    <!-- Lógica de Cálculo y Automatización en JavaScript -->
    <script>
        // Función para cambiar las horas automáticamente según el período seleccionado
        function actualizarHorasPorPeriodo() {
            const periodicidad = document.getElementById('periodicidad').value;
            const tiempoInput = document.getElementById('tiempo');

            if (periodicidad === "anual") {
                tiempoInput.value = 8760; // 365 días * 24 horas
            } else if (periodicidad === "mensual") {
                tiempoInput.value = 730;  // Promedio mensual aproximado (30.4 días)
            } else if (periodicidad === "diario") {
                tiempoInput.value = 24;   // 1 día * 24 horas
            }

            // Recalcular inmediatamente el factor de planta tras el cambio de horas
            calcularFactor();
        }

        function calcularFactor() {
            // Obtener los valores numéricos
            let energia = parseFloat(document.getElementById('energia').value) || 0;
            let potencia = parseFloat(document.getElementById('potencia').value) || 0;
            const tiempo = parseFloat(document.getElementById('tiempo').value) || 0;
            
            // Obtener las magnitudes seleccionadas
            const unidadEnergia = document.getElementById('unidad_energia').value;
            const unidadPotencia = document.getElementById('unidad_potencia').value;

            const resultadoElement = document.getElementById('resultado');

            // --- NORMALIZACIÓN DE UNIDADES ---
            if (unidadEnergia === "GWh") { energia = energia * 1000000; }
            else if (unidadEnergia === "MWh") { energia = energia * 1000; }

            if (unidadPotencia === "GW") { potencia = potencia * 1000000; }
            else if (unidadPotencia === "MW") { potencia = potencia * 1000; }
            // ---------------------------------

            // Evitar divisiones por cero o valores incoherentes
            if (potencia <= 0 || tiempo <= 0 || energia <= 0) {
                resultadoElement.innerText = "0.00%";
                return;
            }

            // Aplicar la fórmula matemática (Energía_Norm / (Potencia_Norm * Tiempo)) * 100
            const factorPlanta = (energia / (potencia * tiempo)) * 100;

            // Mostrar el resultado final en pantalla con dos decimales
            resultadoElement.innerText = factorPlanta.toFixed(2) + "%";
        }

        function compartirWhatsApp() {
            const energia = document.getElementById('energia').value;
            const unidadEnergia = document.getElementById('unidad_energia').value;
            const potencia = document.getElementById('potencia').value;
            const unidadPotencia = document.getElementById('unidad_potencia').value;
            const periodicidad = document.getElementById('periodicidad').options[document.getElementById('periodicidad').selectedIndex].text;
            const tiempo = document.getElementById('tiempo').value;
            const resultado = document.getElementById('resultado').innerText;

            // Formatear el mensaje incluyendo el nuevo dato de periodicidad analizada
            const mensaje = `*Cálculo de Factor de Planta FV* ☀️🔌%0A%0A` +
                            `• *Período:* ${periodicidad}%0A` +
                            `• *Energía:* ${energia} ${unidadEnergia}%0A` +
                            `• *Potencia:* ${potencia} ${unidadPotencia}%0A` +
                            `• *Tiempo:* ${tiempo} horas%0A%0A` +
                            `📊 *Factor de Planta Resultante:* *${resultado}*%0A%0A` +
                            `_Calculado con Modo Energía_`;

            window.open(`https://api.whatsapp.com/send?text=${mensaje}`, '_blank');
        }

        // Forzar el primer cálculo al cargar la página por completo
        window.onload = calcularFactor;
    </script>
</body>
</html>
